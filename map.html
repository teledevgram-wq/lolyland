<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loly Land · Карта</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .map-fullscreen {
            padding: 40px 20px;
            min-height: calc(100vh - 80px);
        }
        .map-container-full {
            max-width: 1400px;
            margin: 0 auto;
            height: 70vh;
        }
        .map-container-full iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <!-- Шапка на весь экран -->
    <header class="header sticky full-width">
        <div class="header-container">
            <div class="logo-area">
                <h1 class="logo">Loly Land<span class="badge">#vanilla</span></h1>
                <div class="start-date">1.21.4 · Started 23.02.2026</div>
            </div>
            <nav class="nav">
                <ul>
                    <li><a href="index.html" class="application-link">Назад</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="page-wrapper">
        <main class="map-fullscreen">
            <section class="fade-in">
                <div class="container">
                    <h2 class="section-title">Карта мира</h2>
                    <p class="section-subtitle">Следите за игроками и исследуйте мир в реальном времени</p>
                    <div class="map-container-full">
                        <iframe src="http://n39.joinserver.xyz:25962/" allowfullscreen></iframe>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        // Анимация при прокрутке
        const fadeElements = document.querySelectorAll('.fade-in');
        
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, {
            threshold: 0.1
        });
        
        fadeElements.forEach(element => {
            observer.observe(element);
        });
    </script>
</body>
</html>
